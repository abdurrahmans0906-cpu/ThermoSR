version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: thermosr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thermosr
      POSTGRES_PASSWORD: thermosr_password
      POSTGRES_DB: thermosr_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thermosr-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://thermosr:thermosr_password@db:5432/thermosr_db
      - DATABASE_SYNC_URL=postgresql://thermosr:thermosr_password@db:5432/thermosr_db
      - DATASET_ROOT_DEFAULT=/app/data
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thermosr-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
